<!DOCTYPE html>
<html>

<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form id="myform">
        <h2 align="center"> Registration Form</h2>

        <label>Name</label>
        <input type="text" id="name" placeholder="Enter Name" required>

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter Email" required>

        <label>Mobile Number</label>
        <input type="tel" id="mobile" placeholder="10-digit Mobile" required>

        <label>Age</label>
        <input type="number" id="age" min="17" max="30" placeholder="17 - 30" required>

        <label>Date of Birth</label>
        <input type="date" id="dob" required>

        <label>Bio</label><br>
        <textarea id="bio" placeholder="message" class="textarea"></textarea> <br>

        <label>Course</label>
        <select id="course" required>
            <option value="">Select Course</option>
            <option>BCA 1st Year</option>
            <option>BCA 2nd Year</option>
        </select>

        <button id="btn" type="submit">Register</button>

        <div class="para">
            <p class="para-paragraph">X</p>
            <p>You Entered Data Successfully</p>
        </div>
    </form>
    <script>
        const form = document.getElementById("myform");
        const name = document.getElementById("name");
        const email = document.getElementById("email");
        const mobile = document.getElementById("mobile");
        const age = document.getElementById("age");
        const dob = document.getElementById("dob");
        const course = document.getElementById("course");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            if (
                name.value.trim() === "" ||
                email.value.trim() === "" ||
                mobile.value.trim() === "" ||
                age.value.trim() === "" ||
                dob.value === "" ||
                course.value === ""
            ) {
                alert("Please fill in all required fields.");
            } else {
                alert(
                    "Registration Successful!\n\n" +
                    "Name: " + name.value.trim() + "\n" +
                    "Email: " + email.value.trim() + "\n" +
                    "Mobile Number: " + mobile.value.trim() + "\n" +
                    "Age: " + age.value + "\n" +
                    "Date of Birth: " + dob.value + "\n" +
                    "Course: " + course.value
                );

                form.reset();
            }
        });
    </script>
</body>

</html>
